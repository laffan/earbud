[package]
name = "earbud"
version = "0.1.0"
description = "Earbud: an offline-first musical sketchbook"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519).
name = "earbud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-capture = { path = "../plugins/tauri-plugin-capture" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
