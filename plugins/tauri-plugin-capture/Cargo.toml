[package]
name = "tauri-plugin-capture"
version = "0.1.0"
description = "Earbud capture engine: native synchronized audio/video recording (AVFoundation on iOS)"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-capture"
license = "MIT"

[dependencies]
tauri = { version = "2.12" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
