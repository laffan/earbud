[package]
name = "tauri-plugin-watch-link"
version = "0.1.0"
description = "Earbud: receive recordings from the Apple Watch app over Bluetooth LE and WatchConnectivity (iOS)"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-watch-link"
license = "MIT"

[dependencies]
tauri = { version = "2.12" }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
