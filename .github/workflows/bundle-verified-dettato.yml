name: Bundle verified Dettato model
on:
  push:
    branches: [dettato]
    paths: ['.github/workflows/bundle-verified-dettato.yml']
jobs:
  bundle:
    if: github.repository == 'laffan/earbud' && github.ref == 'refs/heads/dettato'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '14653848063'
          run-id: '44786641625'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified
          merge-multiple: true
      - name: Include the simulator-tested weights in the branch
        run: |
          cp "$RUNNER_TEMP/verified/transcriber.onnx" public/models/dettato/transcriber.onnx
          git add -f public/models/dettato/transcriber.onnx
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Bundle the verified offline Dettato weights with Earbud"
          git push origin HEAD:refs/heads/dettato
